spring:
  application:
    name: sisc-rookie-web
  datasource:
    # 로컬 시연용 H2 인메모리. PostgreSQL 호환 모드로 동작시켜 추후 PG 전환을 쉽게 한다.
    url: jdbc:h2:mem:sisc;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

security:
  jwt:
    # 운영 환경에서는 환경변수(SECURITY_JWT_SECRET)로 반드시 교체한다.
    secret: ${SECURITY_JWT_SECRET:sisc-rookie-local-development-secret-please-change-me}
    expiration-seconds: 86400

logging:
  level:
    org.hibernate.SQL: debug
